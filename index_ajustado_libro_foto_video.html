<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XV Dayra Lissette</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
body{font-family:Georgia,"Times New Roman",serif}

/* =========================
   PANTALLA 1 - PORTADA
   ========================= */
#pantalla1{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#100419;
  perspective:1800px;
}
.libro{
  position:relative;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
}
.portada{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  transform-origin:left center;
  transform-style:preserve-3d;
  backface-visibility:hidden;
  transition:transform 1.35s cubic-bezier(.2,.75,.2,1);
  z-index:5;
}
.portada img{
  width:auto;
  height:auto;
  max-width:100vw;
  max-height:100dvh;
  object-fit:contain;
  display:block;
}
#abrir{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:transparent;
  z-index:10;
  cursor:pointer;
}
#pantalla1.abriendo .portada{
  transform:rotateY(-178deg);
}

/* =========================
   PANTALLA FOTO
   LLENA EL CELULAR
   ========================= */
#foto{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  display:none;
  align-items:center;
  justify-content:center;
  background:#000;
  z-index:20;
}
#foto img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center center;
}

/* =========================
   PANTALLA VIDEO
   LLENA EL CELULAR
   ========================= */
#pantalla2{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  display:none;
  align-items:center;
  justify-content:center;
  background:#000;
  z-index:30;
}
#video{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center center;
  background:#000;
}
</style>
</head>

<body>

<section id="pantalla1">
  <div class="libro">
    <div class="portada">
      <img src="portada.png" alt="XV Dayra Lissette">
      <button id="abrir" aria-label="Abrir invitación"></button>
    </div>
  </div>
</section>

<!-- FOTO DE TRANSICIÓN -->
<section id="foto">
  <img src="foto-transicion.jpg" alt="">
</section>

<!-- SOLO TU VIDEO -->
<section id="pantalla2">
  <video id="video" playsinline preload="auto">
    <source src="video-segunda.mp4" type="video/mp4">
  </video>
</section>

<audio id="music" preload="auto">
  <source src="quince-anos.mp3" type="audio/mpeg">
</audio>

<script>
const p1 = document.getElementById("pantalla1");
const foto = document.getElementById("foto");
const p2 = document.getElementById("pantalla2");
const boton = document.getElementById("abrir");
const video = document.getElementById("video");
const music = document.getElementById("music");

let abierto = false;

function abrirInvitacion(){
  if(abierto) return;
  abierto = true;

  // Música desde el toque del usuario
  music.play().catch(()=>{});

  // 1. Abrir el libro
  p1.classList.add("abriendo");

  // 2. Mostrar la foto después de abrir el libro
  setTimeout(()=>{
    p1.style.display = "none";
    foto.style.display = "flex";
  },1350);

  // 3. Después de la foto, mostrar SOLO el video
  setTimeout(()=>{
    foto.style.display = "none";
    p2.style.display = "flex";

    video.currentTime = 0;
    video.loop = false;
    video.play().catch(()=>{});
  },3150);
}

boton.addEventListener("click", abrirInvitacion);
boton.addEventListener("touchend", function(e){
  e.preventDefault();
  abrirInvitacion();
},{passive:false});
</script>

</body>
</html>
