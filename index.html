<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>XV Dayra Lissette</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#160720;
}

/* La imagen NO se recorta: siempre se muestra completa */
.escenario{
  position:relative;
  width:100vw;
  height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#160720;
}

.libro{
  position:relative;
  height:100%;
  aspect-ratio:2 / 3;
  max-width:100vw;
  max-height:100svh;
}

.libro img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
}

/* Área táctil sobre el medallón de la mariposa.
   Está posicionada RELATIVA A LA IMAGEN, no a la pantalla. */
.boton{
  position:absolute;
  left:50%;
  top:51.5%;
  width:15%;
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  border:0;
  border-radius:50%;
  background:transparent;
  cursor:pointer;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

.boton:active{
  transform:translate(-50%,-50%) scale(.94);
}

.mensaje{
  position:fixed;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  z-index:20;
  color:#fff;
  font:12px Arial,sans-serif;
  text-shadow:0 2px 6px #000;
  pointer-events:none;
  white-space:nowrap;
}

/* En pantallas muy anchas mantenemos el libro centrado y completo */
@media (min-width:700px){
  .libro{
    height:100svh;
    width:auto;
  }
}
</style>
</head>
<body>

<main class="escenario">
  <div class="libro">
    <img src="portada.png" alt="Invitación XV Dayra Lissette">
    <button class="boton" id="abrir" aria-label="Abrir invitación"></button>
  </div>
</main>

<audio id="musica" preload="auto" loop>
  <source src="quince-anos.mp3" type="audio/mpeg">
</audio>

<div class="mensaje" id="mensaje">Toca “ABRIR INVITACIÓN”</div>

<script>
document.getElementById("abrir").addEventListener("click", async () => {
  const musica = document.getElementById("musica");
  const mensaje = document.getElementById("mensaje");

  try {
    await musica.play();
    mensaje.textContent = "♪ Reproduciendo · Quince Años";
  } catch (e) {
    mensaje.textContent = "Toca nuevamente para reproducir";
  }

  // Próximo paso: animación de libro + Pantalla 2.
});
</script>

</body>
</html>
