<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XV Dayra Lissette</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#100419;
}
body{font-family:Georgia,"Times New Roman",serif}

/* PANTALLA 1 */
#pantalla1{
  position:fixed;inset:0;width:100vw;height:100svh;
  display:flex;align-items:center;justify-content:center;
  background:#100419;
}
.portada{
  position:relative;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
}
.portada img{
  width:auto;height:auto;
  max-width:100vw;max-height:100svh;
  object-fit:contain;display:block;
}

/* Toda la portada responde al toque para que nunca falle el botón */
#abrir{
  position:absolute;inset:0;
  width:100%;height:100%;
  border:0;background:transparent;
  cursor:pointer;z-index:20;padding:0;
}

/* PANTALLA 2: SOLO VIDEO */
#pantalla2{
  display:none;
  position:fixed;inset:0;
  width:100vw;height:100svh;
  background:#000;
}
#video{
  width:100%;height:100%;
  display:block;
  object-fit:cover;
}
</style>
</head>
<body>

<section id="pantalla1">
  <div class="portada">
    <img src="portada.png" alt="Invitación XV Dayra Lissette">
    <button id="abrir" aria-label="Abrir invitación"></button>
  </div>
</section>

<section id="pantalla2">
  <video id="video" playsinline autoplay preload="auto">
    <source src="video-segunda.mp4" type="video/mp4">
  </video>
</section>

<audio id="musica" preload="auto">
  <source src="quince-anos.mp3" type="audio/mpeg">
</audio>

<script>
const boton = document.getElementById("abrir");
const pantalla1 = document.getElementById("pantalla1");
const pantalla2 = document.getElementById("pantalla2");
const video = document.getElementById("video");
const musica = document.getElementById("musica");

function abrirInvitacion(){
  // Cambiar inmediatamente a la segunda pantalla
  pantalla1.style.display = "none";
  pantalla2.style.display = "block";

  // La música comienza después del toque del usuario
  musica.currentTime = 0;
  musica.play().catch(()=>{});

  // El video se reproduce automáticamente y UNA SOLA VEZ.
  video.currentTime = 0;
  video.loop = false;
  video.play().catch(()=>{});
}

boton.addEventListener("click", abrirInvitacion);
boton.addEventListener("touchend", function(e){
  e.preventDefault();
  abrirInvitacion();
}, {passive:false});
</script>

</body>
</html>
