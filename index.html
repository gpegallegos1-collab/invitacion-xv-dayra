<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XV Dayra Lissette</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#pantalla1,#foto,#pantalla2{position:fixed;inset:0;width:100vw;height:100dvh}

/* PORTADA */
#pantalla1{display:flex;align-items:center;justify-content:center;background:#100419;perspective:1800px}
.libro{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;transform-style:preserve-3d}
.portada{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;transform-origin:left center;transform-style:preserve-3d;backface-visibility:hidden;transition:transform 1.35s cubic-bezier(.2,.75,.2,1)}
.portada img{max-width:100%;max-height:100%;width:auto;height:auto;display:block;object-fit:contain}
#abrir{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;z-index:10}

/* FOTO DE TRANSICIÓN */
#foto{display:none;align-items:center;justify-content:center;background:#000;opacity:0}
#foto img{width:100%;height:100%;object-fit:contain;display:block}
#foto.mostrar{display:flex;animation:aparecer .8s ease forwards}
@keyframes aparecer{from{opacity:0}to{opacity:1}}

/* VIDEO */
#pantalla2{display:none;align-items:center;justify-content:center;background:#000}
#video{width:100%;height:100%;display:block;object-fit:cover;object-position:center;background:#000}
</style>
</head>
<body>

<section id="pantalla1">
 <div class="libro">
  <div class="portada">
   <img src="portada.png" alt="XV Dayra Lissette">
   <button id="abrir" aria-label="Abrir invitación"></button>
  </div>
 </div>
</section>

<section id="foto">
 <img src="foto-transicion.jpg" alt="">
</section>

<section id="pantalla2">
 <video id="video" playsinline preload="auto">
  <source src="video-segunda.mp4" type="video/mp4">
 </video>
</section>

<audio id="music" preload="auto">
 <source src="quince-anos.mp3" type="audio/mpeg">
</audio>

<script>
const p1=document.getElementById('pantalla1');
const foto=document.getElementById('foto');
const p2=document.getElementById('pantalla2');
const boton=document.getElementById('abrir');
const video=document.getElementById('video');
const music=document.getElementById('music');
let abierto=false;

function abrirInvitacion(){
 if(abierto)return;
 abierto=true;

 music.play().catch(()=>{});
 p1.classList.add('abriendo');

 // Abrir libro
 setTimeout(()=>{
   p1.style.display='none';
   foto.classList.add('mostrar');
 },1350);

 // Foto durante 1.8 segundos
 setTimeout(()=>{
   foto.style.display='none';
   p2.style.display='flex';
   video.currentTime=0;
   video.loop=false;
   video.play().catch(()=>{});
 },3150);
}

boton.addEventListener('click',abrirInvitacion);
boton.addEventListener('touchend',e=>{
 e.preventDefault();
 abrirInvitacion();
},{passive:false});
</script>
</body>
</html>
