<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XV Dayra Lissette</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100419}
body{display:flex;align-items:center;justify-content:center}
.portada{position:relative;width:100vw;height:100svh;display:flex;align-items:center;justify-content:center}
.portada img{display:block;width:auto;height:auto;max-width:100vw;max-height:100svh;object-fit:contain}
.boton{
 position:absolute;left:50%;top:51%;
 width:min(16vw,145px);aspect-ratio:1;
 transform:translate(-50%,-50%);
 border:0;border-radius:50%;background:transparent;
 cursor:pointer;z-index:5;-webkit-tap-highlight-color:transparent
}
.boton:active{transform:translate(-50%,-50%) scale(.94)}
</style>
</head>
<body>
<main class="portada">
<img src="portada.png" alt="Invitación de XV años de Dayra Lissette">
<button class="boton" aria-label="Abrir invitación"></button>
</main>
<audio id="musica" preload="auto" loop>
<source src="quince-anos.mp3" type="audio/mpeg">
</audio>
<script>
document.querySelector(".boton").addEventListener("click",async()=>{
 try{await document.getElementById("musica").play()}catch(e){}
});
</script>
</body>
</html>
