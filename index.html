<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>XV Dayra Lissette</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#12051d}
body{overflow:hidden}
.portada{
  position:relative;
  width:100%;
  height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#12051d;
}
.portada img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
}

/* Área invisible sobre el botón "ABRIR INVITACIÓN"
   La imagen ya contiene el diseño del botón. */
.boton-real{
  position:absolute;
  z-index:10;
  left:50%;
  top:88%;
  transform:translate(-50%,-50%);
  width:min(27vw,145px);
  aspect-ratio:1/1;
  border:0;
  border-radius:50%;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.boton-real:focus-visible{
  outline:2px solid rgba(255,255,255,.9);
  outline-offset:5px;
}

.mensaje{
  position:absolute;
  z-index:11;
  left:50%;
  bottom:14px;
  transform:translateX(-50%);
  color:#fff;
  font:12px Arial,sans-serif;
  text-align:center;
  text-shadow:0 2px 6px #000;
  pointer-events:none;
  opacity:.95;
}

@media (min-width:700px){
  .portada{
    width:min(100%,600px);
    margin:auto;
  }
  .boton-real{
    width:150px;
    top:88%;
  }
}
</style>
</head>
<body>

<section class="portada">
  <img src="portada.png" alt="Invitación de XV años de Dayra Lissette">

  <button class="boton-real" id="abrir" aria-label="Abrir invitación"></button>

  <div class="mensaje" id="mensaje">Toca “ABRIR INVITACIÓN”</div>
</section>

<audio id="musica" preload="auto" loop>
  <source src="quince-anos.mp3" type="audio/mpeg">
</audio>

<script>
const boton = document.getElementById("abrir");
const musica = document.getElementById("musica");
const mensaje = document.getElementById("mensaje");

boton.addEventListener("click", async () => {
  try {
    await musica.play();
    mensaje.textContent = "♪ Reproduciendo · Quince Años";
  } catch (e) {
    mensaje.textContent = "Toca nuevamente para reproducir";
  }

  // Próximo paso:
  // aquí conectaremos la Pantalla 2 de la invitación.
});
</script>

</body>
</html>
