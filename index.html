<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XV Dayra Lissette</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:#eee5f2}
body{overflow:hidden;font-family:Georgia,"Times New Roman",serif}
.pantalla{position:fixed;inset:0;width:100%;height:100svh}
#uno{display:flex;align-items:center;justify-content:center;background:#100419}
.portada{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.portada img{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}
#abrir{position:absolute;left:50%;top:51%;width:min(18vw,150px);aspect-ratio:1;transform:translate(-50%,-50%);border:0;border-radius:50%;background:transparent;z-index:10;cursor:pointer}
#dos{display:none;overflow-y:auto;background:#eee5f2;color:#51355d}
.contenido{min-height:100%;text-align:center;padding-bottom:40px}
.video{width:100%;background:#000;line-height:0}
video{display:block;width:100%;height:auto;max-height:58svh;object-fit:contain;background:#000}
.texto{padding:28px 22px}
.frase{font-size:clamp(18px,4.7vw,28px);line-height:1.55;font-style:italic}
.titulo{margin-top:25px;font-size:clamp(34px,9vw,58px);color:#9b76ae;font-style:italic}
.nombre{font-size:clamp(28px,7vw,44px);letter-spacing:2px;margin-top:6px}
</style>
</head>
<body>

<section id="uno" class="pantalla">
 <div class="portada">
  <img src="portada.png" alt="XV Dayra Lissette">
  <button id="abrir" aria-label="Abrir invitación"></button>
 </div>
</section>

<section id="dos" class="pantalla">
 <div class="contenido">
  <div class="video">
   <video id="video" playsinline autoplay muted preload="auto">
    <source src="video-segunda.mp4" type="video/mp4">
   </video>
  </div>
  <div class="texto">
   <div class="frase">“Hay momentos inolvidables que se atesoran en el corazón para siempre, por esa razón, quiero que compartas conmigo este día tan especial”</div>
   <div class="titulo">Mis XV Años</div>
   <div class="nombre">Dayra Lissette</div>
  </div>
 </div>
</section>

<audio id="musica" preload="auto" loop>
 <source src="quince-anos.mp3" type="audio/mpeg">
</audio>

<script>
const boton=document.getElementById("abrir");
const uno=document.getElementById("uno");
const dos=document.getElementById("dos");
const video=document.getElementById("video");
const musica=document.getElementById("musica");

boton.onclick=function(){
  // Cambiamos la pantalla INMEDIATAMENTE.
  uno.style.display="none";
  dos.style.display="block";
  window.scrollTo(0,0);

  // La música puede comenzar porque esto ocurre dentro del toque del usuario.
  musica.play().catch(()=>{});

  // El video está muted para permitir autoplay en celulares.
  video.currentTime=0;
  video.play().catch(()=>{});
};
</script>
</body>
</html>
