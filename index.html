<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XV Dayra Lissette</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
.slide{position:fixed;inset:0;width:100vw;height:100dvh;display:none}
.slide.active{display:flex}

/* SLIDE 1 */
#slide1{align-items:center;justify-content:center;background:#100419;perspective:1800px}
.book{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
transform-origin:left center;transform-style:preserve-3d;backface-visibility:hidden;
transition:transform 1.35s cubic-bezier(.2,.75,.2,1)}
.cover img{max-width:100vw;max-height:100dvh;width:auto;height:auto;object-fit:contain}
#open{position:absolute;inset:0;border:0;background:transparent;z-index:10}
#slide1.opening .cover{transform:rotateY(-178deg)}

/* SLIDES 2-3 */
#slide2,#slide3{align-items:center;justify-content:center;background:#000;width:100vw;height:100dvh;overflow:hidden}
#slide2 img{
position:absolute!important;
inset:0!important;
display:block!important;
width:100vw!important;
height:100dvh!important;
max-width:none!important;
max-height:none!important;
object-fit:cover!important;
object-position:center center!important;
}
#video{width:100%;height:100%;object-fit:cover;object-position:center;background:#000}
@media(min-aspect-ratio:1/1){#video{object-fit:contain}}

/* SLIDE 4 */
#slide4{
position:fixed;inset:0;width:100vw;height:100dvh;
display:flex;align-items:center;justify-content:center;
background:#1d1030;overflow:hidden
}
#slide4 .bg{
position:absolute;inset:0;width:100%;height:100%;
object-fit:contain;object-position:center;background:#1d1030
}
.live-counter{
position:absolute!important;
left:50%!important;
top:auto!important;
bottom:92px!important;
transform:translateX(-50%)!important;
width:min(34vw,430px)!important;
min-width:300px!important;
padding:5px 9px 4px!important;
border:1px solid rgba(220,220,230,.95)!important;
border-radius:12px!important;
background:rgba(38,20,54,.94)!important;
color:#fff!important;
text-align:center!important;
z-index:20!important;
}
.live-title{font:600 8px Georgia,serif!important;letter-spacing:2px!important;color:#e8e8ee!important;margin-bottom:2px!important}
.live-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.live-num{font:400 clamp(19px,2.0vw,28px)/1 Georgia,serif!important;color:#fff!important}
.live-unit{margin-top:1px!important;font:400 7px/1 Arial,sans-serif!important;color:#eee!important}
#next4{
position:absolute!important;
left:50%!important;
bottom:12px!important;
transform:translateX(-50%)!important;
z-index:30!important;
padding:7px 21px!important;
min-width:105px!important;
font-size:13px!important;
}

.live-counter{width:78vw;min-width:245px;bottom:66px;padding:6px 7px 5px}
.live-num{font-size:22px}
.live-unit{font-size:7px}
#next4{bottom:10px;padding:8px 19px;min-width:105px}
}


  #slide2 img{position:absolute!important;inset:0!important;width:100vw!important;height:100dvh!important;object-fit:cover!important;object-position:center center!important}
}
@media(max-width:600px){
 .live-counter{
   bottom:70px!important;
   width:70vw!important;
   min-width:235px!important;
   max-width:290px!important;
   padding:5px 6px 4px!important;
 }
 .live-title{font-size:8px!important}
 .live-num{font-size:20px!important}
 .live-unit{font-size:6px!important}
 #next4{bottom:8px!important;font-size:13px!important;padding:8px 18px!important}
}
#slide2 img{
position:absolute!important;
inset:0!important;
width:100vw!important;
height:100dvh!important;
object-fit:cover!important;
object-position:center center!important;
}
}
</style>
</head>
<body>

<section id="slide1" class="slide active">
 <div class="book"><div class="cover">
  <img src="portada.png" alt="XV Dayra Lissette">
  <button id="open" aria-label="Siguiente"></button>
 </div></div>
</section>

<section id="slide2" class="slide">
 <img src="foto-transicion.jpg" alt="Fotografía">
 <button id="next2" class="nav" type="button">Siguiente</button>
</section>

<section id="slide3" class="slide">
 <video id="video" playsinline preload="auto">
  <source src="video-segunda.mp4" type="video/mp4">
 </video>
 <button id="next3" class="nav" type="button">Siguiente</button>
</section>

<section id="slide4" class="slide">
  <img class="bg" src="slide4-contador.png" alt="">
  <div class="live-counter">
    <div class="live-title">FALTAN</div>
    <div class="live-grid">
      <div><div id="days" class="live-num">00</div><div class="live-unit">DÍAS</div></div>
      <div><div id="hours" class="live-num">00</div><div class="live-unit">HORAS</div></div>
      <div><div id="minutes" class="live-num">00</div><div class="live-unit">MINUTOS</div></div>
      <div><div id="seconds" class="live-num">00</div><div class="live-unit">SEGUNDOS</div></div>
    </div>
  </div>
  <button id="next4" class="nav" type="button">Siguiente</button>
</section>
 <button id="next4" class="nav" type="button">Siguiente</button>
</section>

<audio id="music" preload="auto" loop>
 <source src="quince-anos.mp3" type="audio/mpeg">
</audio>

<script>
const slides=[
 document.getElementById('slide1'),
 document.getElementById('slide2'),
 document.getElementById('slide3'),
 document.getElementById('slide4')
];
const video=document.getElementById('video');
const music=document.getElementById('music');
let current=0;

function goToSlide(n){
 if(n<0 || n>=slides.length)return;
 slides.forEach((s,i)=>s.classList.toggle('active',i===n));
 current=n;
 if(n===2){
   video.currentTime=0;
   video.play().catch(()=>{});
 }else{
   video.pause();
 }
 if(n===3) updateCountdown();
}

/* CADA CAMBIO DE SLIDE ocurre exclusivamente por un clic. */
document.getElementById('open').addEventListener('click',()=>{
 music.play().catch(()=>{});
 document.getElementById('slide1').classList.add('opening');
 goToSlide(1);
});
document.getElementById('next2').addEventListener('click',()=>goToSlide(2));
document.getElementById('next3').addEventListener('click',()=>goToSlide(3));
document.getElementById('next4').addEventListener('click',()=>{});

/* El video NO cambia de slide al terminar. */
video.addEventListener('ended',()=>{});

/* Solo el contador se actualiza cada segundo; NO controla ninguna slide. */
function updateCountdown(){
 const target=new Date(2026,9,17,0,0,0).getTime();
 let diff=Math.max(0,target-Date.now());
 const d=Math.floor(diff/86400000); diff%=86400000;
 const h=Math.floor(diff/3600000); diff%=3600000;
 const m=Math.floor(diff/60000); diff%=60000;
 const s=Math.floor(diff/1000);
 days.textContent=String(d).padStart(2,'0');
 hours.textContent=String(h).padStart(2,'0');
 minutes.textContent=String(m).padStart(2,'0');
 seconds.textContent=String(s).padStart(2,'0');
}
const days=document.getElementById('days');
const hours=document.getElementById('hours');
const minutes=document.getElementById('minutes');
const seconds=document.getElementById('seconds');
updateCountdown();
setInterval(updateCountdown,1000);
</script>
</body>
</html>
