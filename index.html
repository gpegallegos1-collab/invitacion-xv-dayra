<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XV Dayra Lissette</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
.screen{position:fixed;inset:0;width:100vw;height:100dvh}

/* Portada */
#p1{display:flex;align-items:center;justify-content:center;background:#100419;perspective:1800px}
.book{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform-origin:left center;transform-style:preserve-3d;backface-visibility:hidden;transition:transform 1.35s cubic-bezier(.2,.75,.2,1);z-index:5}
.cover img{max-width:100vw;max-height:100dvh;width:auto;height:auto;display:block;object-fit:contain}
#open{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;z-index:10}
#p1.opening .cover{transform:rotateY(-178deg)}

/* Foto */
#photo{display:none;align-items:center;justify-content:center;background:#000;z-index:20}
#photo img{width:100%;height:100%;object-fit:contain;object-position:center}

/* Video */
#p2{display:none;align-items:center;justify-content:center;background:#000;z-index:30}
#video{display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:#000}

/* En celular vertical: llena la pantalla.
   En horizontal: conserva el video completo. */
@media (max-aspect-ratio:1/1){
  #video{width:100vw;height:100dvh;object-fit:cover;object-position:center}
}
@media (min-aspect-ratio:1/1){
  #video{width:100%;height:100%;object-fit:contain}
}
</style>
</head>
<body>

<section id="p1" class="screen">
  <div class="book">
    <div class="cover">
      <img src="portada.png" alt="XV Dayra Lissette">
      <button id="open" aria-label="Abrir invitación"></button>
    </div>
  </div>
</section>

<section id="photo" class="screen">
  <img src="foto-transicion.jpg" alt="">
</section>

<section id="p2" class="screen">
  <video id="video" playsinline preload="auto">
    <source src="video-segunda.mp4" type="video/mp4">
  </video>
</section>

<audio id="music" preload="auto">
  <source src="quince-anos.mp3" type="audio/mpeg">
</audio>

<script>
const p1=document.getElementById('p1');
const photo=document.getElementById('photo');
const p2=document.getElementById('p2');
const open=document.getElementById('open');
const video=document.getElementById('video');
const music=document.getElementById('music');
let started=false;

function startInvitation(){
  if(started)return;
  started=true;

  music.play().catch(()=>{});
  p1.classList.add('opening');

  setTimeout(()=>{
    p1.style.display='none';
    photo.style.display='flex';
  },1350);

  setTimeout(()=>{
    photo.style.display='none';
    p2.style.display='flex';
    video.currentTime=0;
    video.loop=false;
    video.play().catch(()=>{});
  },3150);
}

open.addEventListener('click',startInvitation);
open.addEventListener('touchend',e=>{
  e.preventDefault();
  startInvitation();
},{passive:false});
</script>
</body>
</html>
<style id="final-navigation-fix">
#slide6 #next6{
  display:block!important;
  pointer-events:auto!important;
  position:absolute!important;
  z-index:99999!important;
  left:50%!important;
  bottom:-55px!important;
  top:auto!important;
  transform:translateX(-50%)!important;
  cursor:pointer!important;
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const b=document.getElementById('next6');
  if(b){
    b.onclick=function(e){
      e.preventDefault();
      e.stopPropagation();
      if(typeof showSlide==='function') showSlide(7);
      else if(typeof goToSlide==='function') goToSlide(7);
    };
  }
});
</script>

<script id="final-countdown-fix">
(function(){
  function startCountdown(){
    const target = new Date('2026-10-17T17:00:00-06:00').getTime();
    const ids = {
      d:['days','dias','countDays'],
      h:['hours','horas','countHours'],
      m:['minutes','minutos','countMinutes'],
      s:['seconds','segundos','countSeconds']
    };
    function put(list,val){
      for(const id of list){
        const el=document.getElementById(id);
        if(el){ el.textContent=String(val).padStart(2,'0'); return true; }
      }
      return false;
    }
    function tick(){
      let diff=target-Date.now();
      if(diff<0) diff=0;
      const sec=Math.floor(diff/1000);
      const days=Math.floor(sec/86400);
      const hours=Math.floor((sec%86400)/3600);
      const mins=Math.floor((sec%3600)/60);
      const secs=sec%60;
      put(ids.d,days); put(ids.h,hours); put(ids.m,mins); put(ids.s,secs);
    }
    tick();
    setInterval(tick,1000);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',startCountdown);
  else startCountdown();
})();
</script>
