<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XV Dayra Lissette</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#180d27}
.slide{position:fixed;inset:0;width:100vw;height:100dvh;display:none;overflow:hidden}
.slide.active{display:flex}

/* SLIDE 1 */
#slide1{align-items:center;justify-content:center;background:#100419;perspective:1800px}
.book{position:absolute;inset:0}
.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
transform-origin:left center;transition:transform 1.35s cubic-bezier(.2,.75,.2,1);
backface-visibility:hidden}
.cover img{max-width:100vw;max-height:100dvh;width:auto;height:auto;object-fit:contain}
#open{position:absolute;inset:0;border:0;background:transparent;z-index:10}
#slide1.opening .cover{transform:rotateY(-178deg)}

/* SLIDE 2 */
#slide2{align-items:center;justify-content:center;background:#000}
#slide2 img{position:absolute;inset:0;width:100vw;height:100dvh;object-fit:cover;object-position:center}
.nav{position:absolute;z-index:50;left:50%;bottom:12px;transform:translateX(-50%);
padding:9px 22px;border:1px solid #fff;border-radius:999px;background:rgba(74,34,96,.96);
color:#fff;font:700 14px Arial,sans-serif;min-width:110px}

/* SLIDE 3 */
#slide3{align-items:center;justify-content:center;background:#000}
#video{width:100%;height:100%;object-fit:cover;background:#000}

/* SLIDE 4 */
#slide4{align-items:center;justify-content:center;background:#180d27}
#slide4 .art{position:absolute;inset:0;width:100%;height:100%;
background-image:url("slide4-contador.png");
background-repeat:no-repeat;background-position:center;background-size:contain}
.timer{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);
width:min(36vw,450px);min-width:320px;padding:6px 9px 5px;
border:1px solid rgba(220,220,230,.95);border-radius:13px;
background:rgba(38,20,54,.95);color:#fff;text-align:center;z-index:20}
.timer-title{font:600 8px Georgia,serif;letter-spacing:2px;margin-bottom:2px}
.timer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.timer-num{font:400 clamp(20px,2.2vw,30px)/1 Georgia,serif}
.timer-unit{margin-top:2px;font:400 7px/1 Arial,sans-serif}
#next4{bottom:7px}







@media(max-width:600px){
 #slide4 .art{
   background-image:url("slide4-contador.png")!important;
   background-size:100% 100%!important;
   background-position:center!important;
   background-repeat:no-repeat!important;
 }
 .timer{
   top:84%!important;bottom:auto!important;left:50%!important;
   transform:translate(-50%,-50%)!important;
   width:68vw!important;min-width:230px!important;max-width:290px!important;
   padding:5px 6px 4px!important;z-index:50!important;
 }
 .timer-title{font-size:8px!important}
 .timer-num{font-size:20px!important}
 .timer-unit{font-size:6px!important}
 #next4{
   top:94%!important;bottom:auto!important;left:50%!important;
   transform:translate(-50%,-50%)!important;z-index:60!important;
   padding:8px 18px!important;min-width:105px!important;
 }
}
</style>




<style id="slide5-final">
#slide5{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;display:none!important;overflow:hidden!important;background:#180d27!important;}
#slide5.active{display:flex!important;align-items:center!important;justify-content:center!important;}
#slide5Frame{position:relative!important;height:100dvh!important;width:min(calc(100dvh * 2 / 3),100vw)!important;aspect-ratio:2/3!important;flex:none!important;}
#slide5Image{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:fill!important;display:block!important;}
#mapsLink{position:absolute!important;left:50%!important;top:78%!important;width:55%!important;height:7%!important;transform:translate(-50%,-50%)!important;z-index:20!important;background:transparent!important;}
#next5{position:absolute!important;left:50%!important;bottom:10px!important;transform:translateX(-50%)!important;z-index:30!important;min-width:145px!important;padding:10px 28px!important;border:2px solid #fff!important;border-radius:30px!important;background:#542080!important;color:#fff!important;font:700 17px Arial,sans-serif!important;box-shadow:0 3px 12px rgba(0,0,0,.4)!important;}
@media(max-aspect-ratio:2/3){#slide5Frame{width:100vw!important;height:calc(100vw * 1.5)!important;max-height:100dvh!important;}}
</style></head>
<body>

<section id="slide1" class="slide active">
  <div class="book"><div class="cover">
    <img src="portada.png" alt="XV Dayra Lissette">
    <button id="open" aria-label="Abrir invitación"></button>
  </div></div>
</section>

<section id="slide2" class="slide">
  <img src="foto-transicion.jpg" alt="">
  <button id="next2" class="nav">Siguiente</button>
</section>

<section id="slide3" class="slide">
  <video id="video" playsinline preload="auto">
    <source src="video-segunda.mp4" type="video/mp4">
  </video>
  <button id="next3" class="nav">Siguiente</button>
</section>

<section id="slide4" class="slide">
  <div class="art" aria-hidden="true"></div>
  <div class="timer">
    <div class="timer-title">FALTAN</div>
    <div class="timer-grid">
      <div><div id="days" class="timer-num">00</div><div class="timer-unit">DÍAS</div></div>
      <div><div id="hours" class="timer-num">00</div><div class="timer-unit">HORAS</div></div>
      <div><div id="minutes" class="timer-num">00</div><div class="timer-unit">MINUTOS</div></div>
      <div><div id="seconds" class="timer-num">00</div><div class="timer-unit">SEGUNDOS</div></div>
    </div>
  </div>
  <button id="next4" class="nav">Siguiente</button>
</section>

<section id="slide5" class="slide">
  <div id="slide5Frame">
    <img id="slide5Image" src="slide5-final.png" alt="Ceremonia religiosa">
    <a id="mapsLink" href="https://www.google.com/maps/search/?api=1&query=Parroquia%20San%20Judas%20Tadeo%2C%20Av.%20Valle%20de%20Juárez%207628%2C%20Frontera%2C%2032427%20Juárez%2C%20Chihuahua%2C%20México" target="_blank" rel="noopener" aria-label="Abrir Google Maps"></a>
    <button id="next5" type="button">Siguiente</button>
  </div>
</section><audio id="music" preload="auto" loop><source src="quince-anos.mp3" type="audio/mpeg"></audio>

<script>
document.addEventListener('DOMContentLoaded',function(){
  const slides=[1,2,3,4,5].map(n=>document.getElementById('slide'+n));
  const video=document.getElementById('video');
  const music=document.getElementById('music');

  function show(n){
    slides.forEach((s,i)=>s.classList.toggle('active',i===n));
    if(n===2){video.currentTime=0;video.play().catch(()=>{});}
    else video.pause();
  }

  // Always start at Slide 1.
  show(0);

  document.getElementById('open').onclick=function(){
    music.play().catch(()=>{});
    document.getElementById('slide1').classList.add('opening');
    setTimeout(()=>show(1),900);
  };
  document.getElementById('next2').onclick=()=>show(2);
  document.getElementById('next3').onclick=()=>show(3); 
  document.getElementById('next4').onclick=()=>show(4);
  document.getElementById('next5').onclick=()=>show(0);
  document.getElementById('next4').onclick=()=>show(4);
  document.getElementById('next5').onclick=()=>show(0);

  // No automatic slide transition.
  video.addEventListener('ended',()=>{});

  const days=document.getElementById('days'),hours=document.getElementById('hours'),
        minutes=document.getElementById('minutes'),seconds=document.getElementById('seconds');

  function countdown(){
    const target=new Date(2026,9,17,0,0,0).getTime();
    let x=Math.max(0,target-Date.now());
    const d=Math.floor(x/86400000);x%=86400000;
    const h=Math.floor(x/3600000);x%=3600000;
    const m=Math.floor(x/60000);x%=60000;
    const s=Math.floor(x/1000);
    days.textContent=String(d).padStart(2,'0');
    hours.textContent=String(h).padStart(2,'0');
    minutes.textContent=String(m).padStart(2,'0');
    seconds.textContent=String(s).padStart(2,'0');
  }
  countdown();setInterval(countdown,1000);
});
</script>
</body>
</html>
