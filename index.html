<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XV Dayra Lissette</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
.slide{position:fixed;inset:0;width:100vw;height:100dvh;display:none}
.slide.active{display:flex}

/* SLIDE 1 */
#slide1{align-items:center;justify-content:center;background:#100419;perspective:1800px}
.book{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
transform-origin:left center;transform-style:preserve-3d;backface-visibility:hidden;
transition:transform 1.35s cubic-bezier(.2,.75,.2,1)}
.cover img{max-width:100vw;max-height:100dvh;width:auto;height:auto;object-fit:contain}
#open{position:absolute;inset:0;border:0;background:transparent;z-index:10}
#slide1.opening .cover{transform:rotateY(-178deg)}

/* SLIDES 2-3 */
#slide2,#slide3{align-items:center;justify-content:center;background:#000}
#slide2 img{width:100%;height:100%;object-fit:contain;object-position:center}
#video{width:100%;height:100%;object-fit:cover;object-position:center;background:#000}
@media(min-aspect-ratio:1/1){#video{object-fit:contain}}

/* SLIDE 4 */
#slide4{align-items:center;justify-content:center;background:#180d25}
#slide4 .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;background:#180d25}
.countdown{
position:absolute;
left:50%;
bottom:58px;
transform:translateX(-50%);
width:min(34vw,470px);
min-width:290px;
padding:7px 12px 6px;
border:1px solid rgba(215,215,225,.9);
border-radius:14px;
background:rgba(38,20,54,.97);
box-shadow:0 4px 14px rgba(0,0,0,.28);
text-align:center;
color:#fff
}
.label{color:#e2e2e8;letter-spacing:2px;font-size:clamp(9px,.8vw,13px);margin-bottom:2px}
.units{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.num{font-size:clamp(18px,2.2vw,32px);line-height:1;color:#fff;text-shadow:0 0 12px rgba(214,160,255,.7)}
.unit{margin-top:2px;font-size:clamp(7px,.7vw,11px);letter-spacing:1px;color:#eee4f5}
.nav{position:absolute;z-index:999;left:50%;bottom:1%;transform:translateX(-50%);
border:1px solid #fff;border-radius:999px;padding:12px 30px;min-width:135px;
background:rgba(75,35,95,.95);color:#fff;font-family:Arial,sans-serif;font-size:16px;
font-weight:700;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.45)}
@media(max-width:700px){
 .countdown{bottom:48px;width:55vw;min-width:250px;padding:7px 7px 5px;border-radius:13px}
 .label{letter-spacing:2px;font-size:12px}.units{gap:3px}
 .num{font-size:clamp(24px,8vw,42px)}.unit{font-size:9px}
 .nav{bottom:2px;font-size:13px;padding:8px 18px;min-width:105px}
}

/* TRANSICIONES: foto completa + botón SIGUIENTE */
#photoTransition{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000;z-index:9999}
#photoTransition.show{display:flex}
#photoTransition img{width:100%;height:100%;object-fit:cover;object-position:center}
@media(min-aspect-ratio:1/1){#photoTransition img{object-fit:contain;background:#000}}
#nextTransition{position:absolute;z-index:10000;right:3.2%;top:50%;transform:translateY(-50%);
width:72px;height:72px;padding:0;border:1px solid rgba(255,255,255,.9);border-radius:50%;
background:rgba(75,35,95,.88);color:#fff;font-family:Arial,sans-serif;font-size:42px;
font-weight:400;line-height:68px;text-align:center;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.45)}
#nextTransition:hover{background:rgba(95,50,120,.96)}
@media(max-width:700px){#nextTransition{right:3%;width:58px;height:58px;font-size:34px;line-height:54px}}
</style>
</head>
<body>

<section id="slide1" class="slide active">
 <div class="book"><div class="cover">
  <img src="portada.png" alt="XV Dayra Lissette">
  <button id="open" aria-label="Siguiente"></button>
 </div></div>
</section>

<section id="slide2" class="slide">
 <img src="foto-transicion.jpg" alt="Fotografía">
 <button id="next2" class="nav" type="button">Siguiente</button>
</section>

<section id="slide3" class="slide">
 <video id="video" playsinline preload="auto">
  <source src="video-segunda.mp4" type="video/mp4">
 </video>
 <button id="next3" class="nav" type="button">Siguiente</button>
</section>

<section id="slide4" class="slide">
 <img class="bg" src="slide4-contador.png" alt="">
 <section class="countdown">
  <div class="label">FALTAN</div>
  <div class="units">
   <div><div id="days" class="num">00</div><div class="unit">DÍAS</div></div>
   <div><div id="hours" class="num">00</div><div class="unit">HORAS</div></div>
   <div><div id="minutes" class="num">00</div><div class="unit">MINUTOS</div></div>
   <div><div id="seconds" class="num">00</div><div class="unit">SEGUNDOS</div></div>
  </div>
 </section>
 <button id="next4" class="nav" type="button">Siguiente</button>
</section>


<div id="photoTransition" aria-hidden="true">
 <img id="photoTransitionImg" src="transicion-1.jpg" alt="Fotografía">
 <button id="nextTransition" type="button" aria-label="Siguiente">→</button>
</div>
<audio id="music" preload="auto" loop>
 <source src="quince-anos.mp3" type="audio/mpeg">
</audio>

<script>
const slides=[
 document.getElementById('slide1'),
 document.getElementById('slide2'),
 document.getElementById('slide3'),
 document.getElementById('slide4')
];
const video=document.getElementById('video');
const music=document.getElementById('music');
const photoTransition=document.getElementById('photoTransition');
const photoTransitionImg=document.getElementById('photoTransitionImg');
const nextTransition=document.getElementById('nextTransition');
const transitionPhotos=['transicion-1.jpg','transicion-2.jpg','transicion-3.jpg','transicion-4.jpg'];
let current=0;
let pendingSlide=0;
let transitionIndex=0;
let transitionOpen=false;

function showSlide(n){
 slides.forEach((s,i)=>s.classList.toggle('active',i===n));
 current=n;
 if(n===2){
   video.currentTime=0;
   video.play().catch(()=>{});
 }else{
   video.pause();
 }
 if(n===3) updateCountdown();
}

function showTransition(nextSlide){
 pendingSlide=nextSlide;
 photoTransitionImg.src=transitionPhotos[transitionIndex % transitionPhotos.length];
 transitionIndex++;
 photoTransition.classList.add('show');
 photoTransition.setAttribute('aria-hidden','false');
}

function continueFromTransition(){
 photoTransition.classList.remove('show');
 photoTransition.setAttribute('aria-hidden','true');
 showSlide(pendingSlide);
}

/* PORTADA -> FOTO 1 -> SLIDE 2 */
document.getElementById('open').addEventListener('click',()=>{
 music.play().catch(()=>{});
 document.getElementById('slide1').classList.add('opening');
 setTimeout(()=>showTransition(1),1350);
});

/* SLIDE 2 -> FOTO 2 -> SLIDE 3 */
document.getElementById('next2').addEventListener('click',()=>showTransition(2));

/* SLIDE 3 -> FOTO 3 -> SLIDE 4 */
document.getElementById('next3').addEventListener('click',()=>showTransition(3));

/* SLIDE 4 -> FOTO 4 -> PORTADA */
document.getElementById('next4').addEventListener('click',()=>showTransition(0));

/* El botón SIGUIENTE aparece SOBRE cada fotografía de transición. */
nextTransition.addEventListener('click',continueFromTransition);
nextTransition.addEventListener('touchend',e=>{e.preventDefault();continueFromTransition();},{passive:false});

/* El video NO cambia de slide al terminar. */
video.addEventListener('ended',()=>{});

/* Solo el contador se actualiza cada segundo; NO controla ninguna slide. */
function updateCountdown(){
 const target=new Date(2026,9,17,0,0,0).getTime();
 let diff=Math.max(0,target-Date.now());
 const d=Math.floor(diff/86400000); diff%=86400000;
 const h=Math.floor(diff/3600000); diff%=3600000;
 const m=Math.floor(diff/60000); diff%=60000;
 const s=Math.floor(diff/1000);
 days.textContent=String(d).padStart(2,'0');
 hours.textContent=String(h).padStart(2,'0');
 minutes.textContent=String(m).padStart(2,'0');
 seconds.textContent=String(s).padStart(2,'0');
}
const days=document.getElementById('days');
const hours=document.getElementById('hours');
const minutes=document.getElementById('minutes');
const seconds=document.getElementById('seconds');
updateCountdown();
setInterval(updateCountdown,1000);
</script>
</body>
</html>
