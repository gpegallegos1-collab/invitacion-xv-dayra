<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XV Dayra Lissette</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee4f3}
body{font-family:Georgia,"Times New Roman",serif}
.screen{position:fixed;inset:0;width:100vw;height:100svh}
#screen1{display:flex;align-items:center;justify-content:center;background:#100419}
#cover{position:relative;width:100vw;height:100svh;display:flex;align-items:center;justify-content:center}
#cover img{display:block;width:auto;height:auto;max-width:100vw;max-height:100svh;object-fit:contain}
#open{
 position:absolute;left:50%;top:51%;width:min(16vw,145px);aspect-ratio:1;
 transform:translate(-50%,-50%);border:0;border-radius:50%;
 background:transparent;cursor:pointer;z-index:5;
 -webkit-tap-highlight-color:transparent;
}
#open:active{transform:translate(-50%,-50%) scale(.94)}
#screen2{display:none;background:#efe5f3;overflow-y:auto;overflow-x:hidden}
.content{min-height:100%;padding-bottom:45px;text-align:center;color:#4d3158}
.video-wrap{width:100%;background:#000}
#video{display:block;width:100%;height:auto;max-height:56vh;object-fit:cover}
.text{padding:28px 24px 0;max-width:700px;margin:auto}
.quote{font-size:clamp(18px,4.8vw,28px);line-height:1.55;font-style:italic}
.title{margin:25px 0 7px;font-size:clamp(34px,9vw,60px);font-style:italic;color:#8a62a0}
.name{font-size:clamp(28px,7vw,45px);letter-spacing:2px}
.fade{animation:fade .9s ease both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<section id="screen1" class="screen">
 <div id="cover">
  <img src="portada.png" alt="Invitación XV Dayra Lissette">
  <button id="open" aria-label="Abrir invitación"></button>
 </div>
</section>

<section id="screen2" class="screen">
 <div class="content">
  <div class="video-wrap">
   <video id="video" playsinline autoplay muted preload="auto">
    <source src="video-segunda.mp4" type="video/mp4">
   </video>
  </div>
  <div class="text fade">
   <div class="quote">“Hay momentos inolvidables que se atesoran en el corazón para siempre, por esa razón, quiero que compartas conmigo este día tan especial”</div>
   <div class="title">Mis XV Años</div>
   <div class="name">Dayra Lissette</div>
  </div>
 </div>
</section>

<audio id="music" preload="auto" loop>
 <source src="quince-anos.mp3" type="audio/mpeg">
</audio>

<script>
const open=document.getElementById("open");
const screen1=document.getElementById("screen1");
const screen2=document.getElementById("screen2");
const music=document.getElementById("music");
const video=document.getElementById("video");

open.addEventListener("click", async ()=>{
  // El toque del usuario permite iniciar audio y video en celular.
  try{await music.play();}catch(e){}
  screen1.style.display="none";
  screen2.style.display="block";
  video.currentTime=0;
  try{await video.play();}catch(e){}
});
</script>
</body>
</html>
