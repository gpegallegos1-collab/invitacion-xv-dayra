<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XV Dayra Lissette</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
.slide{position:fixed;inset:0;width:100vw;height:100dvh;display:none}
.slide.active{display:flex}

/* SLIDE 1 — PORTADA */
#slide1{align-items:center;justify-content:center;background:#100419;perspective:1800px}
.book{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
transform-origin:left center;transform-style:preserve-3d;backface-visibility:hidden;
transition:transform 1.35s cubic-bezier(.2,.75,.2,1);z-index:5}
.cover img{max-width:100vw;max-height:100dvh;width:auto;height:auto;display:block;object-fit:contain}
#open{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;z-index:10}
#slide1.opening .cover{transform:rotateY(-178deg)}

/* SLIDE 2 — FOTO */
#slide2{align-items:center;justify-content:center;background:#000}
#slide2 img{width:100%;height:100%;object-fit:contain;object-position:center}

/* SLIDE 3 — VIDEO */
#slide3{align-items:center;justify-content:center;background:#000}
#video{width:100%;height:100%;display:block;object-fit:cover;object-position:center;background:#000}
@media (min-aspect-ratio:1/1){#video{object-fit:contain}}

/* SLIDE 4 — CONTADOR */
#slide4{align-items:center;justify-content:center;background:#180d25}
#slide4 .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.countdown{
position:absolute;left:50%;top:74%;transform:translate(-50%,-50%);
width:min(50vw,760px);min-width:420px;padding:22px 34px 18px;
border:2px solid rgba(224,180,75,.9);border-radius:28px;
background:rgba(31,16,42,.92);box-shadow:0 0 28px rgba(219,167,61,.25);
text-align:center;color:#fff
}
.label{color:#e8bd61;letter-spacing:4px;font-size:clamp(14px,1.5vw,22px);margin-bottom:8px}
.units{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.num{font-size:clamp(34px,4.5vw,68px);line-height:1;color:#fff;text-shadow:0 0 12px rgba(214,160,255,.7)}
.unit{margin-top:8px;font-size:clamp(10px,1.1vw,17px);letter-spacing:1px;color:#eee4f5}
.nav{
position:absolute;z-index:50;left:50%;bottom:4%;
transform:translateX(-50%);
border:1px solid rgba(255,255,255,.9);border-radius:999px;
padding:11px 30px;min-width:130px;
background:rgba(75,35,95,.94);color:#fff;
font-family:Arial,sans-serif;font-size:16px;font-weight:700;
letter-spacing:1px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.45)
}
@media(max-width:700px){
 .countdown{top:73%;width:88vw;min-width:0;padding:14px 10px 12px;border-radius:20px}
 .label{letter-spacing:2px;font-size:12px}
 .units{gap:3px}.num{font-size:clamp(24px,8vw,42px)}
 .unit{font-size:9px;letter-spacing:.3px}
 .nav{bottom:3%;font-size:15px;padding:10px 25px;min-width:120px}
}
</style>
</head>
<body>

<!-- 1 -->
<section id="slide1" class="slide active">
  <div class="book">
    <div class="cover">
      <img src="portada.png" alt="XV Dayra Lissette">
      <button id="open" aria-label="Abrir invitación"></button>
    </div>
  </div>
</section>

<!-- 2 -->
<section id="slide2" class="slide">
  <img src="foto-transicion.jpg" alt="Fotografía">
  <button id="next2" class="nav" type="button">Siguiente</button>
</section>

<!-- 3 -->
<section id="slide3" class="slide">
  <video id="video" playsinline preload="auto">
    <source src="video-segunda.mp4" type="video/mp4">
  </video>
  <button id="next3" class="nav" type="button">Siguiente</button>
</section>

<!-- 4 -->
<section id="slide4" class="slide">
  <img class="bg" src="slide4-contador.png" alt="">
  <section class="countdown" aria-label="Cuenta regresiva">
    <div class="label">FALTAN</div>
    <div class="units">
      <div><div id="days" class="num">00</div><div class="unit">DÍAS</div></div>
      <div><div id="hours" class="num">00</div><div class="unit">HORAS</div></div>
      <div><div id="minutes" class="num">00</div><div class="unit">MINUTOS</div></div>
      <div><div id="seconds" class="num">00</div><div class="unit">SEGUNDOS</div></div>
    </div>
  </section>
  <button id="next4" class="nav" type="button">Siguiente</button>
</section>

<audio id="music" preload="auto" loop>
  <source src="quince-anos.mp3" type="audio/mpeg">
</audio>

<script>
const s1=document.getElementById('slide1');
const s2=document.getElementById('slide2');
const s3=document.getElementById('slide3');
const s4=document.getElementById('slide4');
const video=document.getElementById('video');
const music=document.getElementById('music');

function show(el){el.classList.add('active')}
function hide(el){el.classList.remove('active')}

function goTo(el){
  [s1,s2,s3,s4].forEach(hide);
  show(el);
}

/* Slide 1 -> Slide 2: only by user click */
function openInvitation(){
  music.play().catch(()=>{});
  s1.classList.add('opening');
  goTo(s2);
}
document.getElementById('open').addEventListener('click',openInvitation);
document.getElementById('open').addEventListener('touchend',e=>{
  e.preventDefault(); openInvitation();
},{passive:false});

/* Slide 2 -> Slide 3: only by Siguiente */
document.getElementById('next2').addEventListener('click',()=>{
  goTo(s3);
  video.currentTime=0;
  video.play().catch(()=>{});
});
document.getElementById('next2').addEventListener('touchend',e=>{
  e.preventDefault();
  goTo(s3);
  video.currentTime=0;
  video.play().catch(()=>{});
},{passive:false});

/* Slide 3 -> Slide 4: only by Siguiente */
function nextToSlide4(){
  video.pause();
  goTo(s4);
  updateCountdown();
}
document.getElementById('next3').addEventListener('click',nextToSlide4);
document.getElementById('next3').addEventListener('touchend',e=>{
  e.preventDefault(); nextToSlide4();
},{passive:false});

/* Slide 4 -> Slide 5 later: button is intentionally present but does not
   auto-advance. For now it stays on slide 4. */
document.getElementById('next4').addEventListener('click',()=>{
  /* Slide 5 will be connected here when it is created. */
});

/* Dynamic countdown — calculated when the page is opened and updated every second. */
function updateCountdown(){
  const target=new Date(2026,9,17,0,0,0).getTime();
  let diff=Math.max(0,target-Date.now());
  const d=Math.floor(diff/86400000); diff%=86400000;
  const h=Math.floor(diff/3600000); diff%=3600000;
  const m=Math.floor(diff/60000); diff%=60000;
  const s=Math.floor(diff/1000);
  document.getElementById('days').textContent=String(d).padStart(2,'0');
  document.getElementById('hours').textContent=String(h).padStart(2,'0');
  document.getElementById('minutes').textContent=String(m).padStart(2,'0');
  document.getElementById('seconds').textContent=String(s).padStart(2,'0');
}
updateCountdown();
setInterval(updateCountdown,1000);
</script>
</body>
</html>
