<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Botones Siguiente</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#180d27;font-family:Georgia,serif}
.slide{
  display:none;
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  align-items:center;
  justify-content:center;
  color:#fff;
}
.slide.active{display:flex}
.next{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  width:58px;
  height:58px;
  border-radius:50%;
  border:2px solid #eeeeF5;
  background:linear-gradient(180deg,#7133a4 0%,#4d187d 100%);
  box-shadow:0 3px 8px rgba(0,0,0,.35);
  color:white;
  font-family:Arial,sans-serif;
  font-size:38px;
  line-height:50px;
  cursor:pointer;
  z-index:9999;
}
.next:active{transform:translateY(-50%) scale(.96)}
.next:hover{filter:brightness(1.08)}
.label{font-size:28px}
</style>
</head>
<body>

<section class="slide active"><div class="label">SLIDE 1</div><button class="next" onclick="nextSlide()">›</button></section>
<section class="slide"><div class="label">SLIDE 2</div><button class="next" onclick="nextSlide()">›</button></section>
<section class="slide"><div class="label">SLIDE 3</div><button class="next" onclick="nextSlide()">›</button></section>
<section class="slide"><div class="label">SLIDE 4</div><button class="next" onclick="nextSlide()">›</button></section>
<section class="slide"><div class="label">SLIDE 5</div><button class="next" onclick="nextSlide()">›</button></section>
<section class="slide"><div class="label">SLIDE 6</div><button class="next" onclick="nextSlide()">›</button></section>

<script>
let current=0;
const slides=document.querySelectorAll('.slide');
function nextSlide(){
  slides[current].classList.remove('active');
  current=(current+1)%slides.length;
  slides[current].classList.add('active');
}
</script>
</body>
</html>
