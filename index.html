<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12051d">
<title>XV Dayra Lissette</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#12051d;
  overflow:hidden;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

/* La portada se muestra COMPLETA.
   Nunca usamos cover, por lo que no se corta. */
.portada{
  position:relative;
  width:100vw;
  height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#12051d;
}

.portada-img{
  display:block;
  width:auto;
  height:auto;
  max-width:100vw;
  max-height:100svh;
  object-fit:contain;
  user-select:none;
  -webkit-user-drag:none;
}

/* El botón visible ya está dibujado en la imagen.
   Esta zona invisible coincide con él y permite tocarlo. */
.abrir{
  position:absolute;
  left:50%;
  top:50.8%;
  transform:translate(-50%,-50%);
  width:min(17vw,150px);
  height:min(17vw,150px);
  max-height:150px;
  max-width:150px;
  border:0;
  border-radius:50%;
  background:transparent;
  padding:0;
  cursor:pointer;
  z-index:5;
  -webkit-tap-highlight-color:transparent;
}

.abrir:active{
  transform:translate(-50%,-50%) scale(.94);
}

/* Evita que un texto tape la portada */
.estado{
  position:fixed;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  z-index:10;
  color:rgba(255,255,255,.9);
  font:11px Arial,sans-serif;
  text-shadow:0 1px 5px #000;
  pointer-events:none;
  opacity:.85;
}
</style>
</head>

<body>
<main class="portada">
  <img
    class="portada-img"
    src="portada-final.png"
    alt="Invitación de XV años de Dayra Lissette"
  >

  <button
    class="abrir"
    id="abrir"
    aria-label="Abrir invitación">
  </button>
</main>

<audio id="musica" preload="auto" loop>
  <source src="quince-anos.mp3" type="audio/mpeg">
</audio>

<div class="estado" id="estado">Toca ABRIR INVITACIÓN</div>

<script>
const abrir = document.getElementById("abrir");
const musica = document.getElementById("musica");
const estado = document.getElementById("estado");

abrir.addEventListener("click", async () => {
  try {
    await musica.play();
    estado.textContent = "♪ Reproduciendo · Quince Años";
  } catch (e) {
    estado.textContent = "Toca nuevamente";
  }
});
</script>
</body>
</html>
