<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XV Dayra Lissette</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1d1030}
.slide{position:fixed;inset:0;width:100vw;height:100dvh;display:none}
.slide.active{display:flex}

/* Slides 1-3 are unchanged in behavior */
#slide1{align-items:center;justify-content:center;background:#100419;perspective:1800px}
.book{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
transform-origin:left center;transform-style:preserve-3d;backface-visibility:hidden;
transition:transform 1.35s cubic-bezier(.2,.75,.2,1)}
.cover img{max-width:100vw;max-height:100dvh;width:auto;height:auto;display:block;object-fit:contain}
#open{position:absolute;inset:0;border:0;background:transparent;z-index:5}
#slide1.opening .cover{transform:rotateY(-178deg)}

#slide2,#slide3{align-items:center;justify-content:center;background:#000}
#slide2 img{width:100%;height:100%;object-fit:contain}
#video{width:100%;height:100%;display:block;object-fit:cover;background:#000}
@media(min-aspect-ratio:1/1){#video{object-fit:contain}}

.nav{position:absolute;z-index:50;left:50%;bottom:14px;transform:translateX(-50%);
padding:9px 24px;border:1px solid rgba(255,255,255,.95);border-radius:999px;
background:rgba(74,34,96,.96);color:#fff;font:700 14px Arial,sans-serif;
min-width:110px;box-shadow:0 4px 14px rgba(0,0,0,.35)}

/* Slide 4 */
#slide4{align-items:center;justify-content:center;background:#1d1030}
#slide4 .bg{position:absolute;inset:0;width:100%;height:100%;
object-fit:contain;object-position:center;background:#1d1030}
.live-counter{
position:absolute;left:50%;top:90%;
transform:translate(-50%,-50%);
width:min(34vw,500px);min-width:290px;
padding:8px 12px 6px;
border:1px solid rgba(220,220,230,.95);
border-radius:14px;
background:rgba(46,25,64,.96);
color:#fff;text-align:center;
box-shadow:0 4px 14px rgba(0,0,0,.25);
z-index:20;
}
.live-title{font:600 10px Georgia,serif;letter-spacing:2px;color:#e9e9ef;margin-bottom:3px}
.live-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.live-num{font:400 clamp(20px,2.4vw,34px)/1 Georgia,serif;color:#fff}
.live-unit{margin-top:2px;font:400 8px/1 Arial,sans-serif;color:#efeff4}
#next4{bottom:10px}
@media(max-width:600px){
  #slide4 .bg{width:100%;height:auto;max-width:none;max-height:none;top:0;bottom:auto;left:0;right:auto;object-fit:contain}
  .live-counter{
    top:auto;bottom:62px;
    width:72vw;min-width:240px;
    padding:7px 8px 5px;border-radius:13px;
  }
  .live-title{font-size:9px}
  .live-num{font-size:23px}
  .live-unit{font-size:7px}
  #next4{bottom:10px}
}
</style>
</head>
<body>

<section id="slide1" class="slide active">
  <div class="book"><div class="cover">
    <img src="portada.png" alt="XV Dayra Lissette">
    <button id="open" aria-label="Abrir invitación"></button>
  </div></div>
</section>

<section id="slide2" class="slide">
  <img src="foto-transicion.jpg" alt="">
  <button id="next2" class="nav" type="button">Siguiente</button>
</section>

<section id="slide3" class="slide">
  <video id="video" playsinline preload="auto">
    <source src="video-segunda.mp4" type="video/mp4">
  </video>
  <button id="next3" class="nav" type="button">Siguiente</button>
</section>

<section id="slide4" class="slide">
  <img class="bg" src="slide4-contador.png" alt="">
  <div class="live-counter">
    <div class="live-title">FALTAN</div>
    <div class="live-grid">
      <div><div id="days" class="live-num">00</div><div class="live-unit">DÍAS</div></div>
      <div><div id="hours" class="live-num">00</div><div class="live-unit">HORAS</div></div>
      <div><div id="minutes" class="live-num">00</div><div class="live-unit">MINUTOS</div></div>
      <div><div id="seconds" class="live-num">00</div><div class="live-unit">SEGUNDOS</div></div>
    </div>
  </div>
  <button id="next4" class="nav" type="button">Siguiente</button>
</section>

<audio id="music" preload="auto" loop>
  <source src="quince-anos.mp3" type="audio/mpeg">
</audio>

<script>
const slides=[
 document.getElementById('slide1'),
 document.getElementById('slide2'),
 document.getElementById('slide3'),
 document.getElementById('slide4')
];
const video=document.getElementById('video');
const music=document.getElementById('music');

function show(n){slides.forEach((s,i)=>s.classList.toggle('active',i===n));}

document.getElementById('open').onclick=()=>{
 music.play().catch(()=>{});
 slides[0].classList.add('opening');
 show(1);
};
document.getElementById('next2').onclick=()=>{
 show(2); video.currentTime=0; video.play().catch(()=>{});
};
document.getElementById('next3').onclick=()=>{
 video.pause(); show(3);
};
document.getElementById('next4').onclick=()=>{};

function updateCountdown(){
 const target=new Date(2026,9,17,0,0,0).getTime();
 let diff=Math.max(0,target-Date.now());
 const d=Math.floor(diff/86400000); diff%=86400000;
 const h=Math.floor(diff/3600000); diff%=3600000;
 const m=Math.floor(diff/60000); diff%=60000;
 const s=Math.floor(diff/1000);
 document.getElementById('days').textContent=String(d).padStart(2,'0');
 document.getElementById('hours').textContent=String(h).padStart(2,'0');
 document.getElementById('minutes').textContent=String(m).padStart(2,'0');
 document.getElementById('seconds').textContent=String(s).padStart(2,'0');
}
updateCountdown();
setInterval(updateCountdown,1000);
</script>
</body>
</html>
