<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12051d">
<title>XV Dayra Lissette</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100419}
.scene{width:100vw;height:100svh;display:flex;align-items:center;justify-content:center;perspective:1800px;background:radial-gradient(circle at 50% 40%,#3a1550 0,#180722 45%,#09020e 100%)}
.book{position:relative;width:min(92vw,560px);height:min(94svh,840px);transform-style:preserve-3d}
.page2{position:absolute;inset:0;border-radius:4px;overflow:hidden;background:radial-gradient(circle at 50% 20%,rgba(219,160,255,.25),transparent 28%),linear-gradient(145deg,#210a31,#6f3988 48%,#1a0827);border:1px solid rgba(255,230,255,.45);box-shadow:0 0 50px rgba(207,120,255,.25);display:flex;align-items:center;justify-content:center;text-align:center;color:#fff}
.page2-inner{padding:35px}.page2 .small{letter-spacing:4px;font:13px Arial,sans-serif;text-transform:uppercase;opacity:.9}
.page2 h1{margin:22px 0 10px;font-size:clamp(42px,11vw,70px);font-style:italic;font-weight:normal}
.page2 .ornament{font-size:30px;margin:12px 0}.page2 p{font:16px/1.7 Arial,sans-serif;max-width:360px;margin:auto}
.cover{position:absolute;inset:0;z-index:5;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.45s cubic-bezier(.2,.75,.2,1);backface-visibility:hidden;box-shadow:0 0 35px rgba(0,0,0,.45);border-radius:4px;overflow:hidden;background:#17051f}
.cover img{width:100%;height:100%;display:block;object-fit:contain;background:#17051f}
.open{position:absolute;left:50%;top:50%;width:15%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;border-radius:50%;background:transparent;cursor:pointer;z-index:20;-webkit-tap-highlight-color:transparent}
.open:active{transform:translate(-50%,-50%) scale(.94)}
.book.opened .cover{transform:rotateY(-175deg);pointer-events:none}
.book.opened .open{display:none}
.hint{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:50;color:#fff;font:11px Arial,sans-serif;text-shadow:0 2px 7px #000;white-space:nowrap;opacity:.9;transition:opacity .3s}
</style>
</head>
<body>
<div class="scene">
<div class="book" id="book">
<section class="page2"><div class="page2-inner"><div class="small">Una noche para recordar</div><h1>Mis XV Años</h1><div class="ornament">✦ 🦋 ✦</div><p>Gracias por acompañarme en este momento tan especial.</p></div></section>
<section class="cover"><img src="portada.png" alt="XV Dayra Lissette"><button class="open" id="open" aria-label="Abrir invitación"></button></section>
</div>
</div>
<audio id="music" preload="auto" loop><source src="quince-anos.mp3" type="audio/mpeg"></audio>
<div class="hint" id="hint">Toca ABRIR INVITACIÓN</div>
<script>
const book=document.getElementById("book"), open=document.getElementById("open"), music=document.getElementById("music"), hint=document.getElementById("hint");
open.addEventListener("click",async()=>{try{await music.play()}catch(e){} book.classList.add("opened"); hint.textContent="♪ Reproduciendo · Quince Años"; setTimeout(()=>hint.style.opacity="0",2200)});
</script>
</body>
</html>
