<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XV Dayra Lissette</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#eee7f4}
body{font-family:Georgia,"Times New Roman",serif}
.portada{
  position:relative; min-height:100svh; width:100%;
  display:flex; align-items:flex-end; justify-content:center;
  background:url("portada.png") center/cover no-repeat;
  overflow:hidden;
}
.portada:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent 58%,rgba(42,20,52,.04) 72%,rgba(30,12,40,.35) 100%);
  pointer-events:none;
}
.abrir{
  position:absolute;z-index:2;
  bottom:2.2vh;
  left:50%;transform:translateX(-50%);
  width:min(72vw,320px);min-height:54px;
  border:1px solid #fff;border-radius:34px;
  background:linear-gradient(135deg,#6d4a82,#a982b9,#654675);
  color:#fff;font:700 16px Arial,sans-serif;letter-spacing:.8px;
  box-shadow:0 6px 22px rgba(46,20,57,.45),0 0 14px rgba(255,255,255,.45);
  cursor:pointer;touch-action:manipulation;
  animation:pulse 2.2s ease-in-out infinite;
}
@keyframes pulse{
  50%{transform:translateX(-50%) scale(1.025);
      box-shadow:0 8px 28px rgba(46,20,57,.55),0 0 21px rgba(255,255,255,.65)}
}
#mensaje{
  position:absolute;left:0;right:0;bottom:9.5vh;z-index:3;
  text-align:center;color:#fff;font:11px Arial,sans-serif;
  text-shadow:0 1px 5px #29172f;pointer-events:none;
}
@media (min-width:700px){
  .portada{max-width:600px;margin:auto}
}
</style>
</head>
<body>
<section class="portada">
  <button class="abrir" id="abrir">💜 ABRIR INVITACIÓN</button>
  <div id="mensaje"></div>
</section>

<audio id="musica" preload="auto" loop>
  <source src="quince-anos.mp3" type="audio/mpeg">
</audio>

<script>
document.getElementById("abrir").addEventListener("click", async () => {
  const audio=document.getElementById("musica");
  try{
    await audio.play();
    document.getElementById("mensaje").textContent="♪ Reproduciendo • Quince Años";
  }catch(e){
    document.getElementById("mensaje").textContent="Toca nuevamente para reproducir la música";
  }
});
</script>
</body>
</html>
