<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recepción</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#180d27}
.stage{width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center}
.card{position:relative;height:100dvh;width:min(66.6666667dvh,100vw);aspect-ratio:2/3;background:url("recepcion.png") center/100% 100% no-repeat}
.maps{position:absolute;left:50%;bottom:8.8%;width:54%;height:7.5%;transform:translateX(-50%);display:block}
.next{position:absolute;left:50%;bottom:1.5%;transform:translateX(-50%);padding:9px 28px;border:1px solid white;border-radius:24px;background:#5a2488;color:#fff;font:bold 16px Arial;cursor:pointer}
</style>
</head>
<body>
<div class="stage">
  <div class="card">
    <a class="maps" href="https://www.google.com/maps/search/?api=1&query=C.%20Ram%C3%B3n%20Ray%C3%B3n%201658%2C%2032550%20Ju%C3%A1rez%2C%20Chihuahua%2C%20M%C3%A9xico" target="_blank" rel="noopener" aria-label="Abrir Google Maps"></a>
    <button class="next" onclick="history.back()">Siguiente</button>
  </div>
</div>
</body>
</html>
