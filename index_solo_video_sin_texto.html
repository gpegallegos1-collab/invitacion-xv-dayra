<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XV Dayra Lissette</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#p1,#p2{position:fixed;inset:0;width:100vw;height:100svh}
#p1{display:flex;align-items:center;justify-content:center;background:#100419}
.cover{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.cover img{max-width:100vw;max-height:100svh;width:auto;height:auto;display:block;object-fit:contain}
#open{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;z-index:5}
#p2{display:none;background:#000}
#video{width:100%;height:100%;display:block;object-fit:cover}
</style>
</head>
<body>
<section id="p1">
  <div class="cover">
    <img src="portada.png" alt="XV Dayra Lissette">
    <button id="open" aria-label="Abrir invitación"></button>
  </div>
</section>

<section id="p2">
  <video id="video" playsinline preload="auto">
    <source src="video-segunda.mp4" type="video/mp4">
  </video>
</section>

<audio id="music" preload="auto">
  <source src="quince-anos.mp3" type="audio/mpeg">
</audio>

<script>
const open=document.getElementById('open');
const p1=document.getElementById('p1');
const p2=document.getElementById('p2');
const video=document.getElementById('video');
const music=document.getElementById('music');

function abrir(){
  p1.style.display='none';
  p2.style.display='block';
  music.play().catch(()=>{});
  video.currentTime=0;
  video.loop=false;
  video.play().catch(()=>{});
}
open.addEventListener('click',abrir);
open.addEventListener('touchend',e=>{e.preventDefault();abrir();},{passive:false});
</script>
</body>
</html>
